# Entorno LOCAL: API + copia local de PostgreSQL.
# En producción (Koyeb) solo se despliega la imagen del Dockerfile y la DB vive fuera (Neon).
services:
  evalflow-api:
    build: .
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=evalflow-db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    depends_on:
      evalflow-db:
        condition: service_healthy
    restart: unless-stopped

  evalflow-db:
    image: postgres:18-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "${LOCAL_DB_PORT:-5432}:5432"
    volumes:
      # Postgres 18 guarda los datos en /var/lib/postgresql/18/docker; se monta el directorio padre.
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres18_data:
