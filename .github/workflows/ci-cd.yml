name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Si llega un push nuevo mientras otro sigue en curso, se cancela el anterior.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ${{ vars.DOCKERHUB_USERNAME }}/evalflow-backend-api

jobs:
  # 1) Tests: si fallan, los demás jobs no se ejecutan (needs).
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore evalflow_backend_api.sln

      - name: Build
        run: dotnet build evalflow_backend_api.sln -c Release --no-restore

      - name: Test
        run: dotnet test evalflow_backend_api.sln -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Subir resultados de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"

  # 2) Construye la imagen, la arranca contra un Postgres real y, en main, la sube a Docker Hub.
  docker:
    name: Docker build + smoke test + push
    needs: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: EvalFlowDb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d EvalFlowDb"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build de la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: evalflow-backend-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test del contenedor
        run: |
          docker run -d --name api --network host \
            -e ConnectionStrings__DefaultConnection="Host=localhost;Port=5432;Database=EvalFlowDb;Username=postgres;Password=postgres" \
            -e Jwt__Secret="ci-only-jwt-secret-at-least-32-bytes-long!!" \
            -e ApiKey="ci-api-key" \
            -e Encryption__Key="ci-only-encryption-key-32-bytes!" \
            evalflow-backend-api:ci

          # Esperamos a que la API responda en GET / (hasta ~60 s).
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/ > /dev/null; then
              echo "✅ La API responde"
              break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' api)" != "true" ]; then
              echo "❌ El contenedor se ha detenido"; docker logs api; exit 1
            fi
            sleep 2
          done

          curl -fsS http://localhost:8080/ || { echo "❌ La API no respondió a tiempo"; docker logs api; exit 1; }

          # La app captura los errores de migración y sigue arrancando, así que lo comprobamos en los logs.
          if ! docker logs api 2>&1 | grep -q "Migración completada"; then
            echo "❌ Las migraciones no se aplicaron"; docker logs api; exit 1
          fi

      - name: Logs del contenedor
        if: always()
        run: docker logs api || true

      - name: Login en Docker Hub
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push a Docker Hub
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          docker tag evalflow-backend-api:ci "$IMAGE_NAME:${{ github.sha }}"
          docker tag evalflow-backend-api:ci "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:${{ github.sha }}"
          docker push "$IMAGE_NAME:latest"

  # 3) Despliega en Koyeb la imagen exacta que se acaba de probar (tag = SHA del commit).
  deploy:
    name: Deploy a Koyeb
    needs: docker
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Instalar Koyeb CLI
        uses: koyeb-community/koyeb-actions@v2
        with:
          api_token: ${{ secrets.KOYEB_API_TOKEN }}

      - name: Actualizar servicio
        run: |
          koyeb services update "${{ vars.KOYEB_APP }}/${{ vars.KOYEB_SERVICE }}" \
            --docker "$IMAGE_NAME:${{ github.sha }}"
