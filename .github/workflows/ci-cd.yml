name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Si llega un push nuevo mientras otro sigue en curso, se cancela el anterior.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1) Tests: si fallan, los demás jobs no se ejecutan (needs).
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore evalflow_backend_api.sln

      - name: Build
        run: dotnet build evalflow_backend_api.sln -c Release --no-restore

      - name: Test
        run: dotnet test evalflow_backend_api.sln -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Subir resultados de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"

  # 2) Construye la imagen y la arranca contra un Postgres real para comprobar que funciona.
  docker:
    name: Docker build + smoke test
    needs: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: EvalFlowDb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d EvalFlowDb"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build de la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: evalflow-backend-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test del contenedor
        run: |
          docker run -d --name api --network host \
            -e ConnectionStrings__DefaultConnection="Host=localhost;Port=5432;Database=EvalFlowDb;Username=postgres;Password=postgres" \
            -e Jwt__Secret="ci-only-jwt-secret-at-least-32-bytes-long!!" \
            -e ApiKey="ci-api-key" \
            -e Encryption__Key="ci-only-encryption-key-32-bytes!" \
            evalflow-backend-api:ci

          # Esperamos a que la API responda en GET / (hasta ~60 s).
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/ > /dev/null; then
              echo "✅ La API responde"
              break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' api)" != "true" ]; then
              echo "❌ El contenedor se ha detenido"; docker logs api; exit 1
            fi
            sleep 2
          done

          curl -fsS http://localhost:8080/ || { echo "❌ La API no respondió a tiempo"; docker logs api; exit 1; }

          # La app captura los errores de migración y sigue arrancando, así que lo comprobamos en los logs.
          if ! docker logs api 2>&1 | grep -q "Migración completada"; then
            echo "❌ Las migraciones no se aplicaron"; docker logs api; exit 1
          fi

      - name: Logs del contenedor
        if: always()
        run: docker logs api || true

  # 3) Sube la imagen a Docker Hub (solo en main). Usa el environment Production,
  #    que es donde están DOCKERHUB_USERNAME y DOCKERHUB_TOKEN. Las capas salen de la
  #    caché del job anterior, así que no se recompila.
  push:
    name: Push a Docker Hub
    needs: docker
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Production
    env:
      IMAGE_NAME: ${{ vars.DOCKERHUB_USERNAME }}/evalflow-backend-api
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha

  # 4) Despliega en Koyeb la imagen exacta que se acaba de probar (tag = SHA del commit)
  #    y espera a que el deploy quede sano. Si Koyeb lo marca como fallido, el job falla.
  deploy:
    name: Deploy a Koyeb
    needs: push
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Production
    env:
      IMAGE_NAME: ${{ vars.DOCKERHUB_USERNAME }}/evalflow-backend-api
      KOYEB_CLI_VERSION: 5.12.0
      KOYEB_TOKEN: ${{ secrets.KOYEB_API_TOKEN }}
    steps:
      - name: Comprobar configuración de Koyeb
        id: cfg
        env:
          RAW_APP: ${{ vars.KOYEB_APP }}
          RAW_SERVICE: ${{ vars.KOYEB_SERVICE }}
          RAW_URL: ${{ vars.KOYEB_PUBLIC_URL }}
        run: |
          # Quitamos espacios y saltos de línea que se cuelan al pegar valores en GitHub.
          trim() { printf '%s' "$1" | tr -d '[:space:]'; }
          app=$(trim "$RAW_APP"); service=$(trim "$RAW_SERVICE"); url=$(trim "$RAW_URL")
          if [ -z "$app" ] || [ -z "$service" ] || [ -z "$KOYEB_TOKEN" ]; then
            echo "::error::Faltan KOYEB_APP / KOYEB_SERVICE (variables) o KOYEB_API_TOKEN (secret) en el environment Production."
            exit 1
          fi
          echo "service=$app/$service" >> "$GITHUB_OUTPUT"
          echo "url=${url%/}" >> "$GITHUB_OUTPUT"

      - name: Instalar Koyeb CLI
        run: |
          curl -fsSL "https://github.com/koyeb/koyeb-cli/releases/download/v${KOYEB_CLI_VERSION}/koyeb-cli_${KOYEB_CLI_VERSION}_linux_amd64.tar.gz" \
            | tar xz -C "$RUNNER_TEMP" koyeb
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/koyeb" version

      - name: Desplegar nueva imagen
        run: |
          koyeb services update "${{ steps.cfg.outputs.service }}" \
            --docker "$IMAGE_NAME:${{ github.sha }}" \
            --wait --wait-timeout 10m

      - name: Smoke test en producción
        if: steps.cfg.outputs.url != ''
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "${{ steps.cfg.outputs.url }}/" > /dev/null; then
              echo "✅ Producción responde"; exit 0
            fi
            sleep 5
          done
          echo "::error::${{ steps.cfg.outputs.url }} no responde"; exit 1
