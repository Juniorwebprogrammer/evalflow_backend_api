<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Código de Verificación - EvalFlow</title>
</head>
<body style="margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #f3f4f6; -webkit-font-smoothing: antialiased;">
<table border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #f3f4f6; padding: 40px 20px;">
    <tr>
        <td align="center">
            <table border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 600px; background-color: #ffffff; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); overflow: hidden;">
                <tr>
                    <td align="center" style="padding: 40px 0 20px 0; background-color: #ffffff;">
                        <h1 style="margin: 0; color: #111827; font-size: 28px; font-weight: 800; letter-spacing: -1px;">
                            Eval<span style="color: #2563eb;">Flow</span>
                        </h1>
                    </td>
                </tr>
                <tr>
                    <td style="padding: 20px 40px 40px 40px; text-align: center;">
                        <h2 style="margin: 0 0 20px 0; color: #1f2937; font-size: 20px; font-weight: 600;">
                            Hola, {{UserNombre}}
                        </h2>
                        <p style="margin: 0 0 24px 0; color: #4b5563; font-size: 16px; line-height: 24px;">
                            Has intentado iniciar sesión en tu cuenta. Por tu seguridad, introduce el siguiente código de verificación de 6 dígitos. Este código expirará en 10 minutos.
                        </p>

                        <div style="background-color: #f9fafb; border: 1px dashed #d1d5db; border-radius: 8px; padding: 20px; margin: 30px 0;">
                                <span style="font-size: 32px; font-weight: 700; color: #111827; letter-spacing: 4px;">
                                    {{TwoFactorCode}}
                                </span>
                        </div>

                        <p style="margin: 32px 0 0 0; color: #6b7280; font-size: 14px; line-height: 20px;">
                            Si no has intentado iniciar sesión, cambia tu contraseña inmediatamente.
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
